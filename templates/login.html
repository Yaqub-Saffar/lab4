{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block body %}
<div class="card login">
  <h2>登录</h2>
  <p class="hint">口令经加盐 SM3 校验；私钥在登录时解密到内存</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('login') }}">
    <label>用户名</label>
    <input name="username" value="{{ username or '' }}" autofocus>
    <label>口令</label>
    <input name="pwd" type="password">
    <button type="submit">登 录</button>
  </form>
  <p class="hint small">演示账号：keyuan / shenhe / sysadmin / secadmin / auditor，口令均为 Test@1234</p>
</div>
{% endblock %}
